<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn where to stand on a soccer pitch, play a positioning game, and run your team's lineup and subs on match day.">
<meta name="theme-color" content="#f4f1e8">

<link rel="icon" href="icons/favicon-32.png" sizes="32x32">

<style>
:root{--bg:#f4f1e8;--ink:#15213b;--muted:#5d6679;--card:#fff;--line:#e4dfd2;--soft:#ece7da;--accent:#ff6b35;--atk:#ff6b35;--def:#2f6fdb;--good:#2f9e44;--warn:#e8a317;--danger:#d63939;--r:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:var(--safe-area-inset-top,env(safe-area-inset-top));padding-bottom:calc(78px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom)));-webkit-tap-highlight-color:transparent;line-height:1.4}
button{cursor:pointer}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.logo{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.5px;line-height:1}
.logo span{color:var(--accent)}
.tagline{color:var(--muted);font-size:13px;font-weight:700}
main{max-width:720px;margin:0 auto;padding:0 12px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:0 1px 0 var(--line),0 8px 20px -14px rgba(21,33,59,.3)}
h2{font-family:'Baloo 2',sans-serif;font-size:23px;margin:4px 0 6px;line-height:1.15}
h3{font-family:'Baloo 2',sans-serif;font-size:18px;margin:0 0 8px;line-height:1.2}
p{margin:6px 0}
.muted{color:var(--muted)}.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
.row>label,.lbl{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.row-btns.end{justify-content:flex-end}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;width:100%}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font:inherit;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-weight:800;font-size:14px;color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;font-size:15px;background:var(--ink);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.accent{background:var(--accent)}
.btn.good{background:var(--good)}
.btn.danger{background:var(--danger)}
.btn.big{width:100%;padding:14px;font-size:17px;border-radius:14px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.phase{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.phase button{border:3px solid transparent;border-radius:14px;padding:11px 6px;font:inherit;font-weight:800;font-size:15px;background:var(--soft);color:var(--muted)}
.phase .atk.on{background:#fff1ea;border-color:var(--atk);color:#b33c0f}
.phase .def.on{background:#eaf1ff;border-color:var(--def);color:#1d4fae}
.pitch-wrap{margin:8px 0;text-align:center}
.pitch{width:100%;max-height:66vh;display:block;margin:0 auto;user-select:none;-webkit-user-select:none;border-radius:10px}
.pitch.drag{touch-action:pan-y pinch-zoom}
.pitch text{font-family:Nunito,sans-serif;font-weight:800;pointer-events:none}
.dir{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:3px 0}
.hint{font-size:14px;font-weight:700;color:var(--muted);margin:8px 2px}
.caption{background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px;line-height:1.45;min-height:66px}
.caption b{color:#ffd8c7}
.toggles{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);justify-content:center;margin:6px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.rh{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.badge{display:grid;place-items:center;min-width:46px;height:46px;border-radius:50%;font-weight:800;font-size:15px;padding:0 4px}
.role-sec{border-left:4px solid var(--line);padding:7px 10px;margin:8px 0;border-radius:4px;font-size:15px}
.role-sec.hl.atk{border-color:var(--atk);background:#fff6f1}
.role-sec.hl.def{border-color:var(--def);background:#f1f6ff}
.tip{background:#fff8dc;border-radius:10px;padding:8px 10px;font-weight:700;font-size:15px}
details.rules summary{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:700;cursor:pointer;list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules ol{padding-left:22px;margin:8px 0 0}
details.rules li{margin:6px 0}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-weight:800;font-size:13px;color:#fff}
.pill.atk{background:var(--atk)}.pill.def{background:var(--def)}
.big-q{font-family:'Baloo 2',sans-serif;font-size:21px;line-height:1.2;margin:8px 0 2px}
.gstat{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:var(--muted)}
.gstat b{color:var(--ink)}
.res-head{font-family:'Baloo 2',sans-serif;font-size:26px;line-height:1.1}
.res ul{padding-left:20px;margin:8px 0}.res li{margin:5px 0}
.stars{font-size:44px;letter-spacing:6px;text-align:center}
.hero{text-align:center;padding:22px 16px}
.hero .emoji{font-size:54px;line-height:1}
.prow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.out{opacity:.55}
.num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.pname{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gtag{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:3px}
.bench{display:flex;flex-wrap:wrap;gap:8px}
.bp{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 10px 5px 5px;font:inherit;font-weight:800;color:var(--ink);text-align:left;font-size:14px}
.bp.sel{border-color:var(--accent);background:#fff1ea}
.bp.q{border-color:#22c55e}
.bp .num{width:28px;height:28px;font-size:12px}
.bp small{display:block;color:var(--muted);font-weight:700;font-size:11px;line-height:1.1}
.bp.away{opacity:.5;cursor:default}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.score .team{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .n{font-family:'Baloo 2',sans-serif;font-size:46px;line-height:1}
.score .pm{display:flex;gap:6px;justify-content:center;margin-top:4px}
.clockbox{text-align:center;padding:4px 10px}
.clock{font-family:'Baloo 2',sans-serif;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.clock.over{color:#c2410c}
.per{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e11d48;margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.pt-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pt-row:last-child{border-bottom:0}
.pt-row .nm{font-weight:800;font-size:14px}
.pt-row .mn{font-weight:800;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .4s}
.bar i.low{background:var(--warn)}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:700;font-size:14px}
.qrow .grow{flex:1}
.log{font-size:14px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.log div:last-child{border:0}
.log b{display:inline-block;min-width:34px;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.field{margin-bottom:10px}
.field>label{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.selhint{background:#fff1ea;border:2px dashed var(--accent);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;margin:8px 0}
.sync{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom));z-index:20}
nav.tabs button{flex:1;max-width:220px;border:0;background:none;padding:8px 0 10px;font:inherit;font-weight:800;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button .i{font-size:22px;filter:grayscale(1);opacity:.6}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .i{filter:none;opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(21,33,59,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.modal{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:480px;max-height:85vh;overflow:auto}
@media(min-width:600px){.modal-bg{align-items:center}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;padding:16px 8px;color:var(--muted);font-weight:700}
.banner{background:#fff1ea;border:2px solid var(--accent);border-radius:12px;padding:10px 12px;font-weight:700;margin:8px 0}
.banner a{color:#b33c0f}
.foot{text-align:center;font-size:12px;font-weight:700;color:var(--muted);margin:22px 0 8px}
.foot a{color:var(--muted)}
#install{margin-left:auto;display:none}
</style>
</head>

  <footer class="foot" id="foot"><a href="https://github.com/davepomerlo/pitch-smart/releases/latest/download/pitch-smart.apk">Android app</a> · <a href="https://github.com/davepomerlo/pitch-smart">Source on GitHub</a></footer>
</main>
<nav class="tabs">

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const SX=x=>+(x*0.68).toFixed(2), SY=y=>+(105-y*1.05).toFixed(2);
const meters=(a,b)=>Math.hypot((a.x-b.x)*0.68,(a.y-b.y)*1.05);
const uid=()=>'p'+Math.random().toString(36).slice(2,9);
const mmss=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const fmtMin=s=>Math.floor(s/60)+"'";
const minuteMark=t=>(Math.floor(t/60)+1)+"'";
const GCOL={GK:'#facc15',DEF:'#3b82f6',MID:'#f97316',FWD:'#e11d48'};
const GTXT={GK:'#3b2f00',DEF:'#fff',MID:'#fff',FWD:'#fff'};
const GNAME={GK:'Goalkeeper',DEF:'Defender',MID:'Midfielder',FWD:'Forward'};
const GROUPS=['GK','DEF','MID','FWD'];

/* ---------- content: roles ---------- */
const ROLES={
 GK:{name:'Goalkeeper',short:'Last defender, first attacker',
  atk:'Be a safe pass behind the defenders. Play it short to a centre-back or roll it out wide to a full-back.',
  def:'Stay in line between the ball and the middle of your goal. When the ball is far away, step up toward the edge of your box to sweep up long balls.',
  tip:'Talk! You can see the whole pitch, so tell your defenders where to go.'},
 CB:{name:'Centre-back',short:'The wall in the middle of defence',
  atk:'Split apart wide so the keeper can pass to you. When the ball goes forward, step up toward halfway to keep the team close together.',
  def:'Stay goal-side: between the attacker and our goal. Keep connected to the other defenders, like you are holding the same rope.',
  tip:'Never let a striker get behind you. Watch the ball AND your player.'},
 FB:{name:'Full-back',short:'Defends the side, attacks down the wing',
  atk:'Get wide, close to the sideline! Run up the wing to give your winger an extra pass option.',
  def:'Tuck in toward the centre-backs, especially when the ball is on the other side. Stop crosses coming from your side.',
  tip:'Ball on the far side? Come inside. Ball on your side? Get tight to your winger.'},
 DM:{name:'Holding midfielder',short:'The shield in front of the defence',
  atk:'Stay behind the ball as the safe pass back. Switch the play from one side to the other.',
  def:'Guard the middle in front of your defenders. Block passes into their strikers.',
  tip:'You are the shield. Don’t chase everywhere, protect the centre.'},
 CM:{name:'Central midfielder',short:'The engine that links defence and attack',
  atk:'Find a gap between opponents so you can get the ball facing forward. Make triangles with your teammates.',
  def:'Get back between the ball and our goal. Stay close to the other midfielders so there are no gaps.',
  tip:'Look over your shoulder BEFORE the ball comes, so you already know your next pass.'},
 AM:{name:'Attacking midfielder',short:'The playmaker behind the striker',
  atk:'Find space between their midfield and their defence. Look for the pass through to the striker.',
  def:'Be one of the first to press their midfielders. Block passes into the middle.',
  tip:'Turn and face their goal whenever you can.'},
 WM:{name:'Wide midfielder',short:'Works up and down one side',
  atk:'Go wide to stretch their team. Get forward to help the striker and look for crosses.',
  def:'Run back into line with the other midfielders and protect your side of the pitch.',
  tip:'You are an attacker AND a defender. Your side of the pitch is your job.'},
 W:{name:'Winger',short:'Gives width and speed out wide',
  atk:'Stay wide and high to stretch their defence. Run in behind when a teammate can pass.',
  def:'Track back and help your full-back. Block the pass down your side.',
  tip:'Width makes space! When you stay wide, the middle opens up for your team.'},
 ST:{name:'Striker',short:'The main goal threat',
  atk:'Stay level with the last defender, ready to run behind. Or come short to hold the ball up for teammates.',
  def:'You are the first defender: press their centre-backs and push them to one side.',
  tip:'Keep moving. A striker who stands still is easy to mark.'}
};

/* ---------- formations ---------- */
const P=(id,ab,r,g,x,d,ad)=>({id,ab,r,g,x,d,ad});
const GKP=P('GK','GK','GK','GK',50,0);
const LB3=P('LB','LB','FB','DEF',22,.05,.22), CB3=P('CB','CB','CB','DEF',50,0), RB3=P('RB','RB','FB','DEF',78,.05,.22);
const LB4=P('LB','LB','FB','DEF',14,.05,.38), LCB4=P('LCB','CB','CB','DEF',38,0), RCB4=P('RCB','CB','CB','DEF',62,0), RB4=P('RB','RB','FB','DEF',86,.05,.38);
const FORMATS={
 '7':{label:'7 v 7',forms:{
  '2-3-1':[P('LCB','CB','CB','DEF',33,0),P('RCB','CB','CB','DEF',67,0),P('LM','LM','WM','MID',14,.5,.62),P('CM','CM','CM','MID',50,.42),P('RM','RM','WM','MID',86,.5,.62),P('ST','ST','ST','FWD',50,1)],
  '3-2-1':[P('LB','LB','FB','DEF',20,.05,.25),CB3,P('RB','RB','FB','DEF',80,.05,.25),P('LCM','CM','CM','MID',34,.5),P('RCM','CM','CM','MID',66,.5),P('ST','ST','ST','FWD',50,1)]}},
 '8':{label:'8 v 8',forms:{
  '3-3-1':[LB3,CB3,RB3,P('LM','LM','WM','MID',14,.5,.62),P('CM','CM','CM','MID',50,.42),P('RM','RM','WM','MID',86,.5,.62),P('ST','ST','ST','FWD',50,1)],
  '2-3-2':[P('LCB','CB','CB','DEF',34,0),P('RCB','CB','CB','DEF',66,0),P('LM','LM','WM','MID',14,.5,.6),P('DM','DM','DM','MID',50,.35),P('RM','RM','WM','MID',86,.5,.6),P('LS','ST','ST','FWD',38,1),P('RS','ST','ST','FWD',62,1)]}},
 '9':{label:'9 v 9',forms:{
  '3-2-3':[LB3,CB3,RB3,P('LCM','CM','CM','MID',36,.45),P('RCM','CM','CM','MID',64,.45),P('LW','LW','W','FWD',14,.92),P('ST','ST','ST','FWD',50,1),P('RW','RW','W','FWD',86,.92)],
  '3-3-2':[LB3,CB3,RB3,P('LM','LM','WM','MID',14,.5,.62),P('CM','CM','CM','MID',50,.42),P('RM','RM','WM','MID',86,.5,.62),P('LS','ST','ST','FWD',38,1),P('RS','ST','ST','FWD',62,1)]}},
 '11':{label:'11 v 11',forms:{
  '4-3-3':[LB4,LCB4,RCB4,RB4,P('DM','DM','DM','MID',50,.28),P('LCM','CM','CM','MID',32,.55),P('RCM','CM','CM','MID',68,.55),P('LW','LW','W','FWD',14,.93),P('ST','ST','ST','FWD',50,1),P('RW','RW','W','FWD',86,.93)],
  '4-4-2':[LB4,LCB4,RCB4,RB4,P('LM','LM','WM','MID',12,.5,.66),P('LCM','CM','CM','MID',38,.45),P('RCM','CM','CM','MID',62,.45),P('RM','RM','WM','MID',88,.5,.66),P('LS','ST','ST','FWD',40,1),P('RS','ST','ST','FWD',60,1)],
  '4-2-3-1':[LB4,LCB4,RCB4,RB4,P('LDM','DM','DM','MID',38,.3),P('RDM','DM','DM','MID',62,.3),P('LW','LW','W','FWD',14,.72,.86),P('AM','AM','AM','MID',50,.7),P('RW','RW','W','FWD',86,.72,.86),P('ST','ST','ST','FWD',50,1)]}}
};
const FMT_KEYS=['7','8','9','11'];
const firstForm=f=>Object.keys(FORMATS[f].forms)[0];
function getForm(fmt,form){const f=FORMATS[fmt]||FORMATS['11'];return [GKP].concat(f.forms[form]||f.forms[Object.keys(f.forms)[0]]);}
function neutral(p){return p.g==='GK'?{x:50,y:6}:{x:clamp(p.x,8,92),y:20+p.d*60};}

/* ---------- the positioning model ---------- */
function targets(form,ball,phase,forceKey){
 const atk=phase==='attack';
 const L=atk?52:38;
 const back=atk?clamp(ball.y-30,16,50):clamp(ball.y-22,13,45);
 const w=atk?1.1:0.7, k=atk?0.2:0.4;
 const out={};
 for(const p of form){
  if(p.g==='GK'){
   out[p.id]=atk?{x:50+(ball.x-50)*0.1,y:clamp(4+ball.y*0.12,4,15)}:{x:50+(ball.x-50)*0.25,y:clamp(3+(ball.y-20)*0.12,3,10)};
   continue;
  }
  const d=(atk&&p.ad!=null)?p.ad:p.d;
  out[p.id]={x:clamp(50+(ball.x-50)*k+(p.x-50)*w,4,96),y:clamp(back+d*L,5,atk?92:88)};
 }
 if(atk&&forceKey&&out[forceKey]){out[forceKey]={x:ball.x,y:clamp(ball.y-2,2,98)};return {pos:out,key:forceKey};}
 let key=null,bd=1e9;
 const gkBall=atk&&ball.y<15.5&&ball.x>21&&ball.x<79;

/* ---------- account sync (db capability) ---------- */
const remote={doc:null,writing:false,dirty:false,timer:0};
function scheduleRemote(){if(!remote.doc)return;remote.dirty=true;clearTimeout(remote.timer);remote.timer=setTimeout(flushRemote,1200);}
async function flushRemote(){
 if(!remote.doc||remote.writing||!remote.dirty)return;
 remote.writing=true;remote.dirty=false;
 try{await remote.doc.set({json:JSON.stringify(S),updatedAt:S.updatedAt});setSync('cloud');}
 catch(e){
  const c=e&&e.code;
  if(c==='unavailable'||c==='resource_exhausted'){remote.dirty=true;}
  else{remote.doc=null;setSync('local');}
 }
 finally{remote.writing=false;if(remote.dirty){clearTimeout(remote.timer);remote.timer=setTimeout(flushRemote,2000+Math.random()*1500);}}
}
let syncMode='checking';
function setSync(m){syncMode=m;const el=$('#sync');if(el)el.textContent=syncText();}
function syncText(){return syncMode==='cloud'?'☁️ Saved to your Claude account — open it on any device':syncMode==='local'?'📱 Saved on this device. Use Backup (Squad tab) to move it to another device.':'Checking where to save…';}
async function initRemote(){
 try{
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user){setSync('local');return;}
  const id=await user.id();
  if(!id){setSync('local');return;}
  const ref=db.collection('data/users/'+id).doc('coach');
  let done=false;const t=setTimeout(()=>{if(!done)setSync('local');},10000);
  const snap=await ref.get();done=true;clearTimeout(t);
  remote.doc=ref;
  const d=snap.exists?snap.data():null;
  if(d&&typeof d.json==='string'&&(d.updatedAt||0)>(S.updatedAt||0)){
   try{S=migrate(JSON.parse(d.json));saveLocal();renderAll();}catch(e){}
  }else if(S.updatedAt&&(!d||(d.updatedAt||0)<S.updatedAt)){remote.dirty=true;flushRemote();}
  setSync('cloud');
 }catch(e){setSync('local');}
}

 if(f.filter(q=>q.ab===p.ab).length>1&&p.id!==p.ab)return (p.id[0]==='L'?'left ':p.id[0]==='R'?'right ':'')+p.ab;return p.ab;};
L.spaceAhead=function(opp,dir){const q={x:L.ball.x,y:clamp(L.ball.y+dir*8.6,6,94)};let m=99;for(const k in opp){m=Math.min(m,meters(opp[k],q),segInfo(opp[k],L.ball,q).d+3);}return m>=6?q:null;};
L.startWatch=function(){
 if(isSet())return;

L.wPass=function(){

 const us=L.phase==='attack';
 if(us&&L.ball.y>72)return L.wShot();
 if(us&&w.passes>=6)return L.wLose();
 if(!us&&(w.opasses>=3||L.ball.y<30))return L.wWin();
 const form=us?L.form:L.oform,tgt=us?L.tgt:L.otgt,opp=us?L.otgt:L.tgt,carrier=us?L.forceKey:L.oForceKey,dir=us?1:-1;
 const lim=us?(y=>Math.min(y,Math.max(secondHighest(opp),L.ball.y,50)-0.8)):(y=>Math.max(y,Math.min(secondLowest(opp),L.ball.y,50)+0.8));
 const ch=choosePass(form,tgt,opp,L.ball,carrier,w.recent,dir,lim);
 const who=L.wAb(us,carrier);
 const blk=ch.blocked.map(x=>({b:x.P,at:segInfo(opp[x.cut],L.ball,x.P).pt}));
 if(!ch.best&&carrier==='GK'){
  const r=chooseLong(form,tgt,opp,L.ball,carrier,dir);
  if(r){
   const to=L.wAb(us,r.id);
   L.lane={a:Object.assign({},L.ball),b:r.P,blocked:blk};
   L.wCap(us?`Their forwards block the short passes (red), so our keeper <b>kicks it long</b> over their heads to the open ${to}.`:`Our forwards block the short passes (red), so their keeper kicks it long to their open ${to}. Good pressing!`);
   L.drawOverlay();L.wDo(r,us,carrier,1.25);return;
  }
 }
 if(!ch.best){
  L.lane={a:Object.assign({},L.ball),b:null,blocked:ch.blocked.map(x=>({b:x.P,at:segInfo(opp[x.cut],L.ball,x.P).pt}))};

  L.wCap(us?`Every passing lane is blocked (red), so our ${who} <b>dribbles forward</b> into space.`:'They can’t find a safe pass (our players block the lanes), so they dribble. Our closest player keeps pressing.');
  L.wSet(()=>{L.lane=null;L.wBall(b,1900);if(us)w.passes++;else w.opasses++;L.wSet(L.wPass,1900+2600);},1500);

 }
 if(ch.best&&ch.best.prog<3&&carrier!=='GK'&&Math.random()<.65){

   L.lane=null;
   L.wCap(us?`No forward pass is open, but there’s <b>space ahead</b>, so our ${who} dribbles forward into it.`:`There’s space in front of their ${who}, so they dribble forward. Our nearest player steps up to press.`);
   L.wSet(()=>{L.wBall(q,1900);if(us)w.passes++;else w.opasses++;L.wSet(L.wPass,1900+2400);},900);
   return;
  }
 }
 const r=ch.best,to=L.wAb(us,r.id);
 L.lane={a:Object.assign({},L.ball),b:r.P,blocked:ch.blocked.map(x=>({b:x.P,at:segInfo(opp[x.cut],L.ball,x.P).pt}))};
 const kind=r.prog>8?'a <b>forward pass</b>':r.prog<-3?'a <b>pass back</b> to keep the ball':'a <b>pass across</b> to find space';
 const red=ch.blocked.length?` The red ${ch.blocked.length>1?'lanes are':'lane is'} blocked: ${us?'an opponent':'one of our players'} would intercept.`:'';
 const mv=r.moved?(us?` The ${to} <b>moves into space</b> to get open, so`:` Their ${to} moves into space, so`):` The ${to} is open and`;
 if(r.moved)L.passTo={id:r.id,us,dest:r.P};
 L.wCap(us?`${who.charAt(0).toUpperCase()+who.slice(1)} → ${to}: ${kind}.${mv} the green lane has no opponent in it.${red}`
          :`They look for an open player and find their ${to} (green lane).${red} ${r.prog>8?'We drop back and stay compact.':'We shift across together to block the next pass.'}`);

L.wDo=function(r,us,carrier,slow){
 const w=L.watch;
 L.wSet(()=>{
  const dur=Math.round(clamp((1000+r.len*55)*slow,1400,3800));
  w.recent=[carrier].concat(w.recent).slice(0,2);

  L.wBall(r.P,dur);
  if(us)w.passes++;else w.opasses++;
  L.wSet(()=>{L.passTo=null;L.lane=null;L.drawOverlay();L.wSet(L.wPass,2600);},dur);
 },1700);
};
L.wLose=function(){
 const w=L.watch;L.lane=null;
 let best=null,bd=1e9;for(const p of L.oform){if(p.g==='GK')continue;const d=meters(L.otgt[p.id],L.ball);if(d<bd){bd=d;best=p.id;}}
 L.wCap('<b>Their pressing wins the ball!</b> Switch to defending, fast: the closest player presses and everyone else gets compact.');
 L.phase='defend';L.forceKey=null;L.oForceKey=best;w.recent=[];w.opasses=0;

};

L.wWin=function(){
 const w=L.watch;
 const ch=choosePass(L.oform,L.otgt,L.tgt,L.ball,L.oForceKey,null,-1,null);
 const tryP=ch.blocked[0];
 if(tryP){

  let best=null,bd=99,pt=null;
  for(const p of L.form){if(p.g==='GK')continue;const si=segInfo(L.tgt[p.id],L.ball,tryP.P);if(si.pt&&si.d<bd){bd=si.d;best=p.id;pt=si.pt;}}

   L.drawOverlay();

     L.wCap('<b>We won it back!</b> Now everyone spreads out again to make the pitch BIG. ✅ That’s the end of the move.');
     L.wSet(L.stopWatch,5000);},dur);
   },1700);
   return;
  }
 }
 L.lane=null;const pid=L.key;
 L.phase='attack';L.forceKey=pid;L.oForceKey=null;L.renderControls();L.renderInfo();
 L.wCap(`<b>Our pressure works!</b> Our ${L.wAb(true,pid)} wins the ball. Now everyone spreads out again. ✅ That’s the end of the move.`);

};

 if(d<=5){pts=100;v='Perfect! 🎯';}else if(d<=9){pts=70;v='Great spot! 👍';}else if(d<=14){pts=40;v='Close! 👌';}else{pts=0;v='Not quite 💪';}
 c.checked=true;c.dist=d;c.pts=pts;c.verdict=v;G.st.score+=pts;

function explainAnswer(c){
 if(c.sp)return [c.sp.T.points,`<b>Your job: ${esc(c.sp.job.n)}.</b> ${c.sp.job.t}`];
 const me=c.me,b=c.ball,r=ROLES[me.r],out=[];
 const isKey=me.id===c.key;
 if(isKey)out.push('You were the <b>closest player to the ball</b>, so your job is to press it! Get goal-side, so they can’t dribble straight at our goal.');
 out.push(c.phase==='attack'?'We have the ball, so make the pitch <b>big</b>: wide and up the field.':'They have the ball, so make the pitch <b>small</b>: squeeze in, and get between the ball and our goal.');
 const s=sideOf(b);
 if(s!=='middle')out.push(`The ball is on the <b>${s}</b>, so the whole team slides ${s}.`);
 const far=(me.x-50)*(b.x-50)<0&&Math.abs(me.x-50)>20&&s!=='middle';
 if(far&&!isKey)out.push(c.phase==='attack'?'You’re on the far side: stay wide so we can switch the play to you.':'You’re on the far side: tuck in toward the middle to close the gaps.');
 if(c.offside)out.push('Careful of <b>offside</b>! You can\u2019t be past their second-last defender (usually their last outfield defender) unless you\u2019re behind the ball, so stay level with their back line.');

const numOr=p=>p.num?String(p.num):(p.name||'?').slice(0,2).toUpperCase();
const sortSquad=a=>a.slice().sort((x,y)=>(parseInt(x.num)||999)-(parseInt(y.num)||999)||x.name.localeCompare(y.name));
const periodName=(i,n)=>n===2?(i===1?'1st half':'2nd half'):n===4?'Quarter '+i:n===1?'Match':'Period '+i;

function remap(oldF,newF,slots){
 const res={},used=new Set();
 for(const p of newF){if(slots[p.id]&&oldF.find(o=>o.id===p.id)){res[p.id]=slots[p.id];used.add(p.id);}}
 for(const p of newF){if(res[p.id])continue;const o=oldF.find(o=>!used.has(o.id)&&slots[o.id]&&o.g===p.g);if(o){res[p.id]=slots[o.id];used.add(o.id);}}
 for(const p of newF){if(res[p.id]||p.g==='GK')continue;const o=oldF.find(o=>!used.has(o.id)&&slots[o.id]&&o.g!=='GK');if(o){res[p.id]=slots[o.id];used.add(o.id);}}
 return res;
}

function coachPitch(form,slots,o){
 o=o||{};
 let s=`<svg class="pitch" viewBox="${VB}" xmlns="http://www.w3.org/2000/svg">${pitchMarkup()}`;
 for(const p of form){
  const pid=slots[p.id],pl=pid&&player(pid),pos=neutral(p);
  const sel=ui.sel&&ui.sel.kind==='slot'&&ui.sel.id===p.id;
  const fit=pl&&(!pl.pos||!pl.pos.length||pl.pos.includes(p.g));
  s+=`<g data-act="slot" data-id="${p.id}" transform="translate(${SX(pos.x)} ${SY(pos.y)})" style="cursor:pointer"><circle r="6.5" fill="transparent"/>`;
  if(sel)s+=`<circle r="4.6" fill="rgba(253,224,71,.35)" stroke="#fde047" stroke-width=".8"/>`;
  if(pl){
   s+=`<circle r="3.3" fill="${GCOL[p.g]}" stroke="${fit?'#fff':'#fde047'}" stroke-width="${fit?.5:.8}"/><text y=".85" text-anchor="middle" font-size="${numOr(pl).length>2?1.9:2.4}" fill="${GTXT[p.g]}">${esc(numOr(pl))}</text>`;
   s+=`<text y="-4.3" text-anchor="middle" font-size="1.8" fill="rgba(255,255,255,.92)">${esc(p.ab)}</text>`;
   s+=`<text y="6.1" text-anchor="middle" font-size="2.5" fill="#fff" stroke="rgba(0,0,0,.55)" stroke-width=".6" paint-order="stroke">${esc(shortName(pl.name))}</text>`;
   if(o.mins)s+=`<text y="8.7" text-anchor="middle" font-size="2" fill="#fde68a" stroke="rgba(0,0,0,.5)" stroke-width=".5" paint-order="stroke" data-live="pm" data-pid="${pid}">${fmtMin(o.mins(pid))}</text>`;
  }else{
   s+=`<circle r="3.3" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width=".45" stroke-dasharray="1 .8"/><text y=".75" text-anchor="middle" font-size="2" fill="#fff">${esc(p.ab)}</text>`;
  }
  if(o.queued&&o.queued.has(p.id))s+=`<g transform="translate(3.2 -3)"><circle r="1.9" fill="#22c55e" stroke="#fff" stroke-width=".3"/><text y=".75" text-anchor="middle" font-size="2.2" fill="#fff">⇅</text></g>`;
  s+='</g>';
 }
 return s+'</svg>';
}
function benchBtn(p,o){
 o=o||{};const sel=ui.sel&&ui.sel.kind==='bench'&&ui.sel.id===p.id;
 return `<button class="bp ${sel?'sel':''} ${o.q?'q':''}" data-act="bench" data-id="${p.id}"><span class="num">${esc(numOr(p))}</span><span>${esc(p.name)}<small>${o.sub!=null?o.sub:(p.pos||[]).join(' · ')||'Any position'}</small></span></button>`;
}

 v.innerHTML=`<div class="seg" style="margin-top:8px">${tabs.map(([k,l])=>`<button class="${ui.coachTab===k?'on':''}" data-act="c-tab" data-v="${k}">${l}${k==='match'&&S.match&&!S.match.ended?' <span class="live-dot"></span>':''}</button>`).join('')}</div>${body}<div class="sync" id="sync">${syncText()}</div>`;
}

function cleanSlots(slots){for(const k in slots){const p=player(slots[k]);if(!p||p.out)delete slots[k];}}
function renderLineup(){
 const lu=S.lineup;cleanSlots(lu.slots);
 const form=getForm(lu.fmt,lu.form);
 for(const k in lu.slots)if(!form.find(p=>p.id===k))delete lu.slots[k];
 const inSlots=new Set(Object.values(lu.slots));
 const bench=sortSquad(S.squad.filter(p=>!p.out&&!inSlots.has(p.id)));
 const away=sortSquad(S.squad.filter(p=>p.out));
 const filled=form.filter(p=>lu.slots[p.id]).length;
 const sel=ui.sel;let hint='';
 if(sel&&sel.kind==='slot'){const pid=lu.slots[sel.id];hint=pid?`<b>${esc(pn(pid))}</b> selected. Tap another spot to swap, or a bench player to replace. <button class="btn sm ghost" data-act="lu-bench">↓ Move to bench</button>`:`Now tap a bench player to put them at <b>${esc(form.find(p=>p.id===sel.id).ab)}</b>.`;}
 else if(sel&&sel.kind==='bench')hint=`<b>${esc(pn(sel.id))}</b> selected. Now tap a spot on the pitch.`;
 const lock=S.match&&!S.match.ended?`<div class="selhint">A match is in progress. This is your <b>planned</b> lineup; live changes happen in the Match tab.</div>`:'';
 return `<div class="card"><div class="row"><label>Team size</label></div><div class="seg">${FMT_KEYS.map(f=>`<button class="${lu.fmt===f?'on':''}" data-act="lu-fmt" data-v="${f}">${FORMATS[f].label}</button>`).join('')}</div>
 <div class="row" style="margin-top:10px"><label>Formation</label><div class="chips">${Object.keys(FORMATS[lu.fmt].forms).map(f=>`<button class="chip ${lu.form===f?'on':''}" data-act="lu-form" data-v="${f}">${f}</button>`).join('')}</div></div>
 <div class="row-btns"><button class="btn sm" data-act="lu-auto">✨ Auto-fill</button><button class="btn sm ghost" data-act="lu-clear">Clear all</button></div></div>
 ${lock}
 ${S.squad.length?'':`<div class="selhint">Add players in the <b>Squad</b> tab first, then pick your lineup here.</div>`}
 <div class="selhint" style="${hint?'':'display:none'}">${hint}</div>
 <p class="hint" style="${hint?'display:none':''}">Tap a spot, then a player (or tap two spots to swap). <b>${filled}/${form.length}</b> places filled. A yellow ring means that player isn't marked for that position.</p>
 <div class="pitch-wrap">${coachPitch(form,lu.slots)}</div>
 <div class="card"><h3>Bench (${bench.length})</h3>${bench.length?`<div class="bench">${bench.map(p=>benchBtn(p)).join('')}</div>`:'<div class="empty sm">Nobody on the bench.</div>'}</div>
 ${away.length?`<div class="card"><h3>Absent (${away.length})</h3><div class="bench">${away.map(p=>`<span class="bp away"><span class="num">${esc(numOr(p))}</span>${esc(p.name)}</span>`).join('')}</div></div>`:''}
 <button class="btn big accent" data-act="goto-match">Go to match day ▶</button>`;
}
function lineupTap(kind,id){
 const sel=ui.sel,L=S.lineup.slots;
 if(!sel){ui.sel={kind,id};return renderCoach();}
 if(sel.kind===kind&&sel.id===id){ui.sel=null;return renderCoach();}
 if(kind==='bench'&&sel.kind==='bench'){ui.sel={kind,id};return renderCoach();}
 if(kind==='slot'&&sel.kind==='slot'){const a=L[sel.id],b=L[id];if(b)L[sel.id]=b;else delete L[sel.id];if(a)L[id]=a;else delete L[id];}
 else{const slot=kind==='slot'?id:sel.id,pid=kind==='bench'?id:sel.id;for(const k in L)if(L[k]===pid)delete L[k];L[slot]=pid;}
 ui.sel=null;save();renderCoach();
}
function autoFill(){
 const lu=S.lineup,form=getForm(lu.fmt,lu.form);cleanSlots(lu.slots);
 const used=new Set(Object.values(lu.slots));
 const free=S.squad.filter(p=>!p.out&&!used.has(p.id));
 const take=fn=>{const i=free.findIndex(fn);return i<0?null:free.splice(i,1)[0];};
 const empty=form.filter(p=>!lu.slots[p.id]);
 for(const p of empty){const c=take(q=>q.pos&&q.pos.length===1&&q.pos[0]===p.g)||take(q=>q.pos&&q.pos.includes(p.g));if(c)lu.slots[p.id]=c.id;}
 for(const p of form){if(lu.slots[p.id])continue;const c=p.g==='GK'?take(()=>true):take(q=>!(q.pos&&q.pos.length===1&&q.pos[0]==='GK'))||take(()=>true);if(c)lu.slots[p.id]=c.id;}
 ui.sel=null;save();renderCoach();
}

/* --- match --- */
function mEl(m){return m.acc+(m.running?(Date.now()-m.startedAt)/1000:0);}
function pSecs(m,pid,now){const st=m.stints[pid];if(!st)return 0;let s=0;for(const [a,b] of st)s+=(b==null?now:b)-a;return Math.max(0,s);}
function startStint(m,pid,t){(m.stints[pid]=m.stints[pid]||[]).push([t,null]);}
function endStint(m,pid,t){const st=m.stints[pid];if(st&&st.length&&st[st.length-1][1]==null)st[st.length-1][1]=t;}
function posAb(m,posId){const p=getForm(m.fmt,m.form).find(q=>q.id===posId);return p?p.ab:posId;}
function mlog(m,text){m.log.push({t:mEl(m),text});}

function kickOff(){
 const lu=S.lineup,form=getForm(lu.fmt,lu.form),onField={};
 for(const p of form){const pid=lu.slots[p.id];const pl=pid&&player(pid);if(pl&&!pl.out)onField[p.id]=pid;}
 if(!Object.keys(onField).length){toast('Pick your starting lineup first');ui.coachTab='lineup';return renderCoach();}
 const st=S.settings;
 const m={fmt:lu.fmt,form:lu.form,onField,running:true,startedAt:Date.now(),acc:0,period:1,periodStart:0,periods:clamp(parseInt(st.periods)||2,1,4),periodMin:clamp(parseInt(st.periodMin)||25,1,60),score:[0,0],stints:{},queue:[],log:[],ended:false,date:new Date().toLocaleDateString(),opp:(st.opp||'').trim()||'Opponent',goals:[]};
 for(const pid of Object.values(onField))startStint(m,pid,0);
 m.log.push({t:0,text:'⚽ Kick-off!'});
 S.match=m;ui.sel=null;ui.warned={};save();renderCoach();
}
function endMatch(){
 const m=S.match,t=mEl(m);m.acc=t;m.running=false;
 for(const pid of Object.values(m.onField))endStint(m,pid,t);
 m.ended=true;m.queue=[];m.log.push({t,text:`🏁 Full time: ${S.team||'Us'} ${m.score[0]} – ${m.score[1]} ${m.opp}`});
 ui.sel=null;save();renderCoach();
}
function applySubs(){
 const m=S.match,t=mEl(m);let n=0;
 for(const q of m.queue){
  if(Object.values(m.onField).includes(q.inId))continue;
  const outId=m.onField[q.posId];
  if(outId)endStint(m,outId,t);
  m.onField[q.posId]=q.inId;startStint(m,q.inId,t);
  m.log.push({t,text:`🔁 ${pn(q.inId)} on${outId?' for '+pn(outId):''} (${posAb(m,q.posId)})`});n++;
 }
 m.queue=[];ui.sel=null;save();toast(n===1?'1 sub made':n+' subs made');renderCoach();
}
function matchTap(kind,id){
 const m=S.match;if(!m||m.ended)return;const sel=ui.sel;
 if(!sel){ui.sel={kind,id};return renderCoach();}
 if(sel.kind===kind&&sel.id===id){ui.sel=null;return renderCoach();}
 if(kind==='bench'&&sel.kind==='bench'){ui.sel={kind,id};return renderCoach();}
 if(kind==='slot'&&sel.kind==='slot'){
  const a=m.onField[sel.id],b=m.onField[id];
  if(b)m.onField[sel.id]=b;else delete m.onField[sel.id];
  if(a)m.onField[id]=a;else delete m.onField[id];
  m.queue=m.queue.filter(q=>q.posId!==sel.id&&q.posId!==id);
  mlog(m,`↔️ ${a?pn(a):''}${a&&b?' ⇄ ':''}${b?pn(b):''} changed position`);
  ui.sel=null;save();return renderCoach();
 }
 const posId=kind==='slot'?id:sel.id,inId=kind==='bench'?id:sel.id;
 m.queue=m.queue.filter(q=>q.posId!==posId&&q.inId!==inId);
 m.queue.push({posId,inId});ui.sel=null;save();renderCoach();
}
function matchShare(m,now){
 const n=getForm(m.fmt,m.form).length;
 const pool=S.squad.filter(p=>!p.out||m.stints[p.id]).length||1;
 return {now:now*n/pool,planned:m.periods*m.periodMin*60*n/pool};
}

 const now=mEl(m),form=getForm(m.fmt,m.form),pt=now-m.periodStart;

  else if(sel&&sel.kind==='bench')hint=`<b>${esc(pn(sel.id))}</b> selected. Tap the player on the pitch they'll replace.`;
 }
 const lastP=m.period>=m.periods;
 const scoreBlk=`<div class="card"><div class="score">
  <div><div class="team">${team}</div><div class="n">${m.score[0]}</div>${m.ended?'':`<div class="pm"><button class="btn sm good" data-act="m-goal" data-v="0">+ Goal</button><button class="btn sm ghost" data-act="m-ungoal" data-v="0">−</button></div>`}</div>
  <div class="clockbox">${m.ended?`<div class="per">Full time</div><div class="clock">FT</div>`:`<div class="per">${m.running?'<span class="live-dot"></span>':'⏸ '}${periodName(m.period,m.periods)}</div><div class="clock ${pt>m.periodMin*60?'over':''}" data-live="clock">${mmss(pt)}</div><div class="sm muted">of ${m.periodMin}:00</div>`}</div>

 </div>
 ${m.ended?'':`<div class="row-btns" style="margin-top:12px"><button class="btn ${m.running?'ghost':'accent'}" style="flex:1" data-act="m-clock">${m.running?'⏸ Pause':(now>0?'▶ Resume':'▶ Start')}</button><button class="btn ghost" style="flex:1" data-act="m-endp">${lastP?'🏁 End match':'End '+periodName(m.period,m.periods).toLowerCase()}</button></div>`}</div>`;

 if(!m.ended){

  html+=`<div class="card"><h3>Bench <span class="sm muted" style="font-family:Nunito">· fewest minutes first</span></h3>${bench.length?`<div class="bench">${bench.map(p=>benchBtn(p,{q:queuedIn.has(p.id),sub:`<span data-live="pm" data-pid="${p.id}">${fmtMin(mins(p.id))}</span> played${mins(p.id)<share.now*0.75&&now>120?' · needs time':''}`})).join('')}</div>`:'<div class="empty sm">No one on the bench.</div>'}</div>`;
 }
 html+=`<div class="card"><h3>⏱️ Playing time</h3><p class="sm muted" style="margin-top:-4px">Bar = share of a fair amount of minutes (${Math.round(share.planned/60)}' each for ${all.length} players).</p>${all.map(p=>{const s=mins(p.id);const low=now>120&&s<share.now*0.75;return `<div class="pt-row"><span class="nm">${onIds.has(p.id)&&!m.ended?'🟢 ':''}${esc(numOr(p))} · ${esc(p.name)}</span><span class="mn" data-live="pm" data-pid="${p.id}">${fmtMin(s)}</span><div class="bar"><i class="${low?'low':''}" data-live="bar" data-pid="${p.id}" style="width:${clamp(s/share.planned*100,0,100).toFixed(1)}%"></i></div></div>`;}).join('')}</div>`;
 const logs=m.log.slice().reverse();
 html+=`<div class="card"><h3>📝 Match log</h3><div class="log">${(ui.showLog?logs:logs.slice(0,6)).map(l=>`<div><b>${minuteMark(l.t)}</b> ${esc(l.text)}</div>`).join('')}</div>${logs.length>6?`<button class="btn sm ghost" style="margin-top:6px" data-act="log-more">${ui.showLog?'Show less':'Show all '+logs.length}</button>`:''}</div>
 <div class="row-btns"><button class="btn ghost" style="flex:1" data-act="m-report">📋 Match report</button><button class="btn ghost" style="flex:1" data-act="m-new">${m.ended?'➕ New match':'✕ Cancel match'}</button></div>`;
 return html;
}
function updateLive(){
 const m=S.match;if(!m)return;const now=mEl(m),pt=now-m.periodStart;
 const c=$('[data-live="clock"]');
 if(c){c.textContent=mmss(pt);c.classList.toggle('over',pt>m.periodMin*60);}
 $$('[data-live="pm"]').forEach(e=>{e.textContent=fmtMin(pSecs(m,e.dataset.pid,now));});
 const share=matchShare(m,now);
 $$('[data-live="bar"]').forEach(e=>{const s=pSecs(m,e.dataset.pid,now);e.style.width=clamp(s/share.planned*100,0,100).toFixed(1)+'%';e.classList.toggle('low',now>120&&s<share.now*0.75);});
 const wk=m.period;
 if(m.running&&pt>=m.periodMin*60&&!ui.warned[wk]){ui.warned[wk]=true;toast(`⏰ ${m.periodMin} minutes up: ${periodName(m.period,m.periods)}`);try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
}
setInterval(()=>{const m=S.match;if(!m||!m.running||ui.view!=='coach'||ui.coachTab!=='match')return;updateLive();},1000);
function reportText(){
 const m=S.match;if(!m)return'';const now=mEl(m);
 const lines=[`${S.team||'Us'} ${m.score[0]} – ${m.score[1]} ${m.opp}${m.ended?' (FT)':' (in progress)'}`,`${m.date} · ${FORMATS[m.fmt].label} · ${m.periods} × ${m.periodMin} min`,''];
 if(m.goals&&m.goals.length){lines.push('Goals:');m.goals.forEach(g=>lines.push(`  ${minuteMark(g.t)} ${g.side===0?(g.by?pn(g.by):S.team||'Us'):m.opp}`));lines.push('');}
 lines.push('Minutes played:');
 S.squad.filter(p=>m.stints[p.id]||!p.out).sort((a,b)=>pSecs(m,b.id,now)-pSecs(m,a.id,now)).forEach(p=>lines.push(`  ${p.num?'#'+p.num+' ':''}${p.name}: ${Math.round(pSecs(m,p.id,now)/60)} min`));
 lines.push('','Log:');m.log.forEach(l=>lines.push(`  ${minuteMark(l.t)} ${l.text}`));
 return lines.join('\n');
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-go]');
 if(nav){const v=nav.dataset.go;if(location.hash!=='#'+v)location.hash=v;else go(v);return;}
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
 if(el.tagName==='A')e.preventDefault();
 switch(a){
  case 'modal-close':closeModal();break;
  case 'confirm-ok':{const f=ui.confirmFn;ui.confirmFn=null;closeModal();if(f)f();break;}
  /* learn */
  case 'l-fmt':S.learn.fmt=v;S.learn.form=firstForm(v);S.learn.oppForm='';ui.learnSel=null;save();L.ocur={};L.build();break;
  case 'l-oform':S.learn.oppForm=v;save();L.build();break;
  case 'l-mode':if(L.watch)L.stopWatch();S.learn.mode=v;save();L.spRes=null;if(v==='open')L.tween={a:Object.assign({},L.ball),b:{x:50,y:45},t0:performance.now(),dur:650};L.build();break;
  case 'l-sp':S.learn.sp=v;save();L.spCalc();L.renderControls();L.renderInfo();L.kick();break;
  case 'l-side':S.learn.side=v;save();L.spCalc();L.renderControls();L.renderInfo();L.kick();break;
  case 'g-opp':S.game.opp=!S.game.opp;save();renderGame();break;
  case 'l-form':S.learn.form=v;save();L.build();break;
  case 'l-phase':if(L.watch)L.stopWatch();L.phase=v;if(isSet())L.spCalc();L.renderControls();L.renderInfo();L.kick();break;
  case 'l-tog':ui.tog[v]=!ui.tog[v];if(v==='opp'&&ui.tog.opp){const ot=L.compute().opp;for(const p of L.oform){L.ocur[p.id]=Object.assign({},ot[p.id]);const n=L.onodes[p.id];if(n)n.setAttribute('transform',`translate(${SX(ot[p.id].x)} ${SY(ot[p.id].y)})`);}}L.renderControls();L.drawOverlay();L.kick();break;
  case 'l-watch':if(L.watch)L.stopWatch();else L.startWatch();break;
  /* game */
  case 'g-fmt':S.game.fmt=v;save();renderGame();break;
  case 'g-mode':S.game.mode=v;save();renderGame();break;
  case 'g-start':G.newGame();break;
  case 'g-check':G.check();break;
  case 'g-next':G.nextRound();break;
  case 'g-quit':G.st=null;renderGame();window.scrollTo(0,0);break;
  /* coach */
  case 'c-tab':ui.coachTab=v;ui.sel=null;renderCoach();window.scrollTo(0,0);break;
  case 'goto-match':ui.coachTab='match';ui.sel=null;renderCoach();window.scrollTo(0,0);break;
  case 'f-pos':{syncForm();const p=ui.form.pos,i=p.indexOf(v);if(i<0)p.push(v);else p.splice(i,1);renderCoach();break;}
  case 'f-save':saveForm();break;
  case 'f-cancel':ui.form=null;renderCoach();break;
  case 'sample':loadSample();break;
  case 'p-avail':{const p=player(id);if(!p)break;if(S.match&&!S.match.ended&&Object.values(S.match.onField).includes(id)&&!p.out){toast('Sub them off first');break;}p.out=!p.out;if(p.out)cleanSlots(S.lineup.slots);save();renderCoach();break;}
  case 'p-edit':{const p=player(id);if(!p)break;ui.form={id:p.id,name:p.name,num:p.num||'',pos:(p.pos||[]).slice()};renderCoach();window.scrollTo({top:0,behavior:'smooth'});break;}
  case 'p-del':{const p=player(id);if(!p)break;if(S.match&&S.match.stints[id]){toast('They played in the current match. Mark them Absent instead.');break;}confirmBox(`Remove ${esc(p.name)}?`,'They will be taken out of the squad and lineup.','Remove',()=>{S.squad=S.squad.filter(q=>q.id!==id);cleanSlots(S.lineup.slots);if(ui.form&&ui.form.id===id)ui.form=null;save();renderCoach();},true);break;}
  case 'lu-fmt':{const lu=S.lineup;if(lu.fmt===v)break;const old=getForm(lu.fmt,lu.form);lu.fmt=v;lu.form=firstForm(v);lu.slots=remap(old,getForm(lu.fmt,lu.form),lu.slots);ui.sel=null;save();renderCoach();break;}
  case 'lu-form':{const lu=S.lineup;const old=getForm(lu.fmt,lu.form);lu.form=v;lu.slots=remap(old,getForm(lu.fmt,lu.form),lu.slots);ui.sel=null;save();renderCoach();break;}
  case 'lu-auto':autoFill();break;
  case 'lu-clear':S.lineup.slots={};ui.sel=null;save();renderCoach();break;
  case 'lu-bench':{if(ui.sel&&ui.sel.kind==='slot'){delete S.lineup.slots[ui.sel.id];ui.sel=null;save();renderCoach();}break;}
  case 'slot':if(ui.coachTab==='lineup'||!S.match)lineupTap('slot',id);else matchTap('slot',id);break;
  case 'bench':if(ui.coachTab==='lineup'||!S.match)lineupTap('bench',id);else matchTap('bench',id);break;
  case 'm-kick':kickOff();break;
  case 'm-clock':{const m=S.match;if(m.running){m.acc=mEl(m);m.running=false;}else{m.startedAt=Date.now();m.running=true;}save();renderCoach();break;}
  case 'm-endp':{const m=S.match;const last=m.period>=m.periods;confirmBox(last?'End the match?':`End the ${periodName(m.period,m.periods).toLowerCase()}?`,last?'The clock stops and minutes are final.':'The clock pauses. Press Start when the next period kicks off.',last?'End match':'End '+periodName(m.period,m.periods).toLowerCase(),()=>{const t=mEl(m);m.acc=t;m.running=false;if(m.period<m.periods){m.log.push({t,text:`⏸ End of ${periodName(m.period,m.periods).toLowerCase()} (${m.score[0]}–${m.score[1]})`});m.period++;m.periodStart=t;save();renderCoach();}else endMatch();});break;}
  case 'm-goal':{const m=S.match;if(v==='0'){const on=Object.values(m.onField).map(player).filter(Boolean);modal(`<h3>⚽ Who scored?</h3><div class="bench">${sortSquad(on).map(p=>`<button class="bp" data-act="goal-by" data-id="${p.id}"><span class="num">${esc(numOr(p))}</span>${esc(p.name)}</button>`).join('')}<button class="bp" data-act="goal-by" data-id="">Not sure / own goal</button></div><div class="row-btns end" style="margin-top:12px"><button class="btn ghost" data-act="modal-close">Cancel</button></div>`);}else{m.score[1]++;m.goals.push({t:mEl(m),side:1});mlog(m,`Goal ${m.opp} (${m.score[0]}–${m.score[1]})`);save();renderCoach();}break;}
  case 'goal-by':{const m=S.match;closeModal();m.score[0]++;m.goals.push({t:mEl(m),side:0,by:id||null});mlog(m,`⚽ GOAL! ${id?pn(id):(S.team||'Us')} (${m.score[0]}–${m.score[1]})`);save();renderCoach();toast('Goal! 🎉');break;}
  case 'm-ungoal':{const m=S.match,s=+v;if(m.score[s]>0){m.score[s]--;for(let i=m.goals.length-1;i>=0;i--)if(m.goals[i].side===s){m.goals.splice(i,1);break;}mlog(m,`Score corrected (${m.score[0]}–${m.score[1]})`);save();renderCoach();}break;}
  case 'm-form':{const m=S.match;if(m.form===v)break;const old=getForm(m.fmt,m.form),nf=getForm(m.fmt,v);const before=new Set(Object.values(m.onField));m.onField=remap(old,nf,m.onField);const after=new Set(Object.values(m.onField));const t=mEl(m);before.forEach(pid=>{if(!after.has(pid))endStint(m,pid,t);});m.form=v;m.queue=[];mlog(m,`🧩 Formation changed to ${v}`);ui.sel=null;save();renderCoach();break;}
  case 'q-del':{S.match.queue.splice(+v,1);save();renderCoach();break;}
  case 'q-apply':applySubs();break;
  case 'log-more':ui.showLog=!ui.showLog;renderCoach();break;
  case 'm-report':{modal(`<h3>📋 Match report</h3><textarea id="rep" rows="12" readonly style="font-weight:600;font-size:13px">${esc(reportText())}</textarea><div class="row-btns end" style="margin-top:10px"><button class="btn ghost" data-act="modal-close">Close</button><button class="btn accent" data-act="copy-rep">Copy</button></div>`);break;}
  case 'backup':{const b=JSON.stringify({app:'pitch-smart',v:1,data:S});modal(`<h3>💾 Backup</h3><p class="sm muted">Copy this text and send it to yourself (email, LINE, notes…). Then open Pitch Smart on the other device and tap <b>Restore from backup</b>.</p><textarea id="rep" rows="8" readonly style="font-size:12px">${esc(b)}</textarea><div class="row-btns end" style="margin-top:10px"><button class="btn ghost" data-act="modal-close">Close</button><button class="btn accent" data-act="copy-rep">Copy</button></div>`);break;}
  case 'restore':{modal(`<h3>Restore from backup</h3><p class="sm muted">Paste the backup text below. This replaces the squad, lineup and match on this device.</p><textarea id="restore-text" rows="8" style="font-size:12px" placeholder="Paste backup here"></textarea><div class="row-btns end" style="margin-top:10px"><button class="btn ghost" data-act="modal-close">Cancel</button><button class="btn accent" data-act="restore-ok">Restore</button></div>`);break;}
  case 'restore-ok':{const ta=$('#restore-text');let o=null;try{o=JSON.parse((ta&&ta.value||'').trim());}catch(_){}
   const d=o&&o.app==='pitch-smart'&&o.data?o.data:(o&&Array.isArray(o.squad)?o:null);
   if(!d){toast('That doesn\u2019t look like a Pitch Smart backup');break;}
   S=migrate(d);save();closeModal();ui.sel=null;ui.form=null;renderAll();toast('Backup restored: '+S.squad.length+' players');break;}
  case 'copy-rep':{const ta=$('#rep');const txt=ta?ta.value:'';const fallback=()=>{try{ta.focus();ta.select();const ok=document.execCommand&&document.execCommand('copy');toast(ok?'Copied!':'Text selected: copy it from your keyboard menu');}catch(_){toast('Select the text and copy it');}};try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Copied!'),fallback);else fallback();}catch(_){fallback();}break;}
  case 'm-new':{const m=S.match;confirmBox(m.ended?'Start a new match?':'Cancel this match?',m.ended?'This match’s minutes and log will be cleared. Copy the match report first if you want to keep it.':'The clock, score and minutes for this match will be thrown away.',m.ended?'New match':'Cancel match',()=>{S.match=null;ui.sel=null;save();renderCoach();},!m.ended);break;}
 }
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='team-name'){S.team=t.value.trim()||'Us';save();}
 else if(t.id==='s-opp'){S.settings.opp=t.value.trim();save();}
 else if(t.id==='s-periods'){S.settings.periods=+t.value;save();}
 else if(t.id==='s-min'){S.settings.periodMin=clamp(parseInt(t.value)||25,1,60);t.value=S.settings.periodMin;save();}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&(e.target.id==='f-name'||e.target.id==='f-num')){e.preventDefault();saveForm();}
 if(e.key==='Escape')closeModal();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ui.view==='coach'&&ui.coachTab==='match'&&S.match)updateLive();});

/* ---------- routing ---------- */
const VIEWS=['learn','play','coach'];
function go(v){
 if(!VIEWS.includes(v))v='learn';
 const changed=ui.view!==v;ui.view=v;
 $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
 $$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
 if(v!=='learn'&&L.watch)L.stopWatch();
 if(v==='learn')L.kick();
 if(v==='play')renderGame();
 if(v==='coach')renderCoach();
 if(changed)window.scrollTo(0,0);
}
function renderAll(){L.build();if(ui.view==='play')renderGame();if(ui.view==='coach')renderCoach();}
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
L.init();
ui.view='';go((location.hash||'').slice(1)||'learn');
initRemote();

/* ---------- standalone app: Android build (Capacitor) or installable web app ---------- */
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()),REPO='davepomerlo/pitch-smart';
if(NATIVE){
 $('#foot').style.display='none';
 // tell the user when GitHub has built a newer version of the app
 (async()=>{try{
  const mine=await (await fetch('app-version.json',{cache:'no-cache'})).json();
  const latest=await (await fetch(`https://api.github.com/repos/${REPO}/releases/latest`)).json();
  if(mine.tag&&latest.tag_name&&latest.tag_name!==mine.tag)
   $('#banner').innerHTML=`<p class="banner">A new version of the app is ready. <a href="https://github.com/${REPO}/releases/latest/download/pitch-smart.apk">Download the update</a></p>`;
 }catch(e){}})();
}else{
 if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
 let deferred=null;const ib=$('#install');
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.style.display='inline-block';});
 ib.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();try{await deferred.userChoice;}catch(_){}deferred=null;ib.style.display='none';});
 addEventListener('appinstalled',()=>{ib.style.display='none';});
}
})();
</script>
